<script>
document.getElementById("
document.getElementById("year").textContent =
  new Date().getFullYear();

// মৃত ব্যক্তিদের তথ্য এখানে যোগ করবেন
const deceasedPeople = [
  {
    name: "আব্দুর রহিম",
    father: "আব্দুল করিম",
    mother: "মোছা. মোমেনা বেগম",
    village: "সরদারপাড়া",
    post: "মাঝডিয়াড়",
    thana: "দৌলতপুর",
    district: "কুষ্টিয়া",
    birth: "১০/১২/১৯৭৮",
    death: "২৩/০৯/২০১৯",
    grave: "০০২",
    notes: ""
  },
  {
    name: "আব্দুর রহমান",
    father: "তথ্য যোগ করুন",
    mother: "তথ্য যোগ করুন",
    village: "সরদারপাড়া",
    post: "মাঝডিয়াড়",
    thana: "দৌলতপুর",
    district: "কুষ্টিয়া",
    birth: "",
    death: "",
    grave: "০০৩",
    notes: ""
  }
];

const list = document.getElementById("deceasedList");
const search = document.getElementById("deceasedSearch");
const details = document.getElementById("deceasedDetails");
const detailName = document.getElementById("detailName");
const detailContent = document.getElementById("detailContent");
const message = document.getElementById("deceasedMessage");

function addDetail(label, value) {
  const row = document.createElement("div");
  row.className = "detail-row";

  const heading = document.createElement("span");
  heading.className = "detail-label";
  heading.textContent = label + ": ";

  const content = document.createElement("span");
  content.textContent = value || "তথ্য দেওয়া হয়নি";

  row.append(heading, content);
  detailContent.appendChild(row);
}

function showDetails(person) {
  detailName.textContent = person.name;
  detailContent.replaceChildren();

  addDetail("পিতার নাম", person.father);
  addDetail("মাতার নাম", person.mother);
  addDetail(
    "ঠিকানা",
    `গ্রাম: ${person.village || "উল্লেখ নেই"}, ` +
    `পোস্ট: ${person.post || "উল্লেখ নেই"}, ` +
    `থানা: ${person.thana || "উল্লেখ নেই"}, ` +
    `জেলা: ${person.district || "উল্লেখ নেই"}`
  );
  addDetail("জন্ম তারিখ", person.birth);
  addDetail("মৃত্যু তারিখ", person.death);
  addDetail("কবর নম্বর", person.grave);

  if (person.notes) {
    addDetail("অন্যান্য তথ্য", person.notes);
  }

  details.hidden = false;

  document.querySelectorAll(".deceased-item")
    .forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.personId === String(
          deceasedPeople.indexOf(person)
        )
      );
    });
}

function renderList() {
  const keyword = search.value.trim().toLowerCase();

  list.replaceChildren();
  details.hidden = true;

  const filtered = deceasedPeople
    .map((person, index) => ({ person, index }))
    .filter(({ person }) =>
      person.name.toLowerCase().includes(keyword)
    );

  message.hidden = filtered.length > 0;

  filtered.forEach(({ person, index }) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "deceased-item";
    button.dataset.personId = String(index);

    const serial = document.createElement("span");
    serial.textContent =
      String(index + 1).padStart(3, "0") + ".";

    const name = document.createElement("span");
    name.style.fontWeight = "normal";
    name.textContent = person.name;

    button.append(serial, name);
    button.addEventListener("click", () => {
      showDetails(person);
    });

    list.appendChild(button);
  });
}

search.addEventListener("input", renderList);

renderList();").textContent = new Date().getFullYear();
</script>
